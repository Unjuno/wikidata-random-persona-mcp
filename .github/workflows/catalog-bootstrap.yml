name: Stage bounded Wikidata catalog (bootstrap only)
on:
  push:
    branches:
      - 'feat/wikidata-dump-sampling-20261028'
    paths:
      - 'scripts/bootstrap-wikidata.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run catalog:bootstrap
      - run: npm run catalog:validate -- data/catalog.pending.json
      - uses: actions/upload-artifact@v4
        with:
          name: unreviewed-wikidata-bootstrap
          path: data/catalog.pending.json
          retention-days: 7
      # Deliberately no contents:write. Promotion and Sites sync require review.
