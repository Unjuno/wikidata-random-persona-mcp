name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Record runtime and resolved dependency versions
        run: |
          node --version
          npm --version
          npm ls --depth=0
      - run: npm run check
      - run: npm run catalog:validate
      - run: npm test
      - name: Build existing-Site release handoff (never deploy)
        if: github.ref == 'refs/heads/main' && matrix.node == '24'
        run: npm run bundle:sites
      - name: Upload verified existing-Site handoff
        if: github.ref == 'refs/heads/main' && matrix.node == '24'
        uses: actions/upload-artifact@v4
        with:
          name: existing-site-release-${{ github.sha }}
          path: |
            dist/
            site-release-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Download build artifact for independent verification
        if: github.ref == 'refs/heads/main' && matrix.node == '24'
        uses: actions/download-artifact@v4
        with:
          name: existing-site-release-${{ github.sha }}
          path: .release-inspection
      - name: Verify archive integrity and boot the extracted Site Worker
        if: github.ref == 'refs/heads/main' && matrix.node == '24'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-extracted-site-release.mjs .release-inspection "$GITHUB_SHA" | tee site-release-qa.json
      - name: Upload extracted-Site QA report
        if: github.ref == 'refs/heads/main' && matrix.node == '24'
        uses: actions/upload-artifact@v4
        with:
          name: existing-site-build-qa-${{ github.sha }}
          path: site-release-qa.json
          if-no-files-found: error
          retention-days: 30
