name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Record runtime and resolved dependency versions
        run: |
          node --version
          npm --version
          npm ls --depth=0
      - run: npm run check
      - run: npm run catalog:validate
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-lock-node-${{ matrix.node }}
          path: package-lock.json
